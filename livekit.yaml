port: 7880
rtc:
  # IMPORTANT: Change 127.0.0.1 to your host machine's actual LAN IP (e.g. 192.168.1.xxx)
  # or use '0.0.0.0' for general binding (but some WebRTC clients require a concrete candidate IP).
  node_ip: 0.0.0.0
  # 單一 UDP 埠共用所有媒體連線（人數多也不會用光埠），UDP 被擋時改走 TCP 7881
  udp_port: 7882
  tcp_port: 7881
  use_external_ip: false
room:
  enable_remote_unmute: true
keys:
  devkey: devsecret1234567890devsecret1234567890
redis:
  address: redis:6379
logging:
  level: info
